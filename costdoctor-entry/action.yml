name: CostDoctor Repository Review Candidate
description: Offline repository signal review; no secret, model call, source upload or savings claim
inputs:
  repository:
    description: Relative directory inside the checked-out workspace
    required: false
    default: '.'
outputs:
  report-directory:
    description: Runner-local directory containing sanitized report.json and report.md
  scan-status:
    description: SCAN_COMPLETE, PARTIAL_SCAN, or NO_SUPPORTED_SOURCE; never a savings verdict
runs:
  using: node24
  main: entry/action.mjs
