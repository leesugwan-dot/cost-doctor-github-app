name: CostDoctor public repository scan

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: costdoctor-public-${{ github.actor }}
  cancel-in-progress: false

jobs:
  scan:
    if: startsWith(github.event.issue.title, '[CostDoctor Scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted CostDoctor code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Use fixed Node major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          check-latest: false
          package-manager-cache: false

      - name: Analyze submitted public repository
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/public_scan.py

      - name: Keep sanitized result and receipt briefly
        if: ${{ always() && steps.scan.outputs.public-output-dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: costdoctor-public-report-${{ github.event.issue.number }}
          path: ${{ steps.scan.outputs.public-output-dir }}/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
