name: CostDoctor public scan self-test

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/public-scan.yml'
      - '.github/workflows/**'
      - 'costdoctor-entry/**'
      - 'public_scan_contract.json'
      - 'product_readiness.json'
      - 'verified_fix_contract.json'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/public-scan.yml'
      - '.github/workflows/**'
      - 'costdoctor-entry/**'
      - 'public_scan_contract.json'
      - 'product_readiness.json'
      - 'verified_fix_contract.json'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Use fixed Node major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          check-latest: false
          package-manager-cache: false

      - name: Python unit tests
        run: python3 .github/scripts/test_public_scan.py

      - name: Node syntax checks
        run: |
          node --check costdoctor-entry/entry/scan.mjs
          node --check costdoctor-entry/entry/cli.mjs
          node --check costdoctor-entry/entry/action.mjs

      - name: Product boundary invariant checks
        run: |
          python3 -m json.tool public_scan_contract.json >/dev/null
          python3 -m json.tool product_readiness.json >/dev/null
          python3 -m json.tool verified_fix_contract.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/public-scan.yml').read_text(encoding='utf-8')
          script = Path('.github/scripts/public_scan.py').read_text(encoding='utf-8')
          form = Path('.github/ISSUE_TEMPLATE/public-scan.yml').read_text(encoding='utf-8')
          private_workflow = Path('costdoctor-entry/private-repo-selfscan.yml').read_text(encoding='utf-8')
          contract = json.loads(Path('public_scan_contract.json').read_text(encoding='utf-8'))
          readiness = json.loads(Path('product_readiness.json').read_text(encoding='utf-8'))
          fix = json.loads(Path('verified_fix_contract.json').read_text(encoding='utf-8'))

          assert 'contents: read' in workflow
          assert 'issues: write' in workflow
          assert 'contents: write' not in workflow
          assert 'pull_request_target' not in workflow
          assert 'secrets.' not in workflow
          assert 'PUBLIC_REPO_REQUIRED' in script
          assert 'MAX_SCANS_PER_USER_24H = 5' in script
          assert 'GIT_CONFIG_NOSYSTEM' in script
          assert 'protocol.file.allow=never' in script
          assert 'receipt_sha256' in script
          assert 'lock_issue' in script
          assert '결과 언어 / Result language' in form
          assert contract['execution']['target_code_executed'] is False
          assert contract['execution']['operator_personal_pc_used'] is False
          assert contract['execution']['target_repository_write'] is False
          assert contract['privacy']['raw_source_in_public_result'] is False
          assert contract['claims']['actual_savings_verified_by_public_scan'] is False
          assert readiness['hard_boundaries']['operator_personal_pc_for_customer_code'] is False
          assert readiness['hard_boundaries']['public_scan_target_repository_write'] is False
          assert 'contents: read' in private_workflow
          assert 'contents: write' not in private_workflow
          assert fix['hard_rules']['automatic_merge'] is False
          assert fix['hard_rules']['direct_default_branch_overwrite'] is False
          PY

      - name: Fresh scanner smoke test
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/costdoctor-fixture"
          out="$RUNNER_TEMP/costdoctor-out"
          mkdir -p "$fixture"
          cat > "$fixture/sample.py" <<'PY'
          def f(client):
              return client.chat()
          PY
          node costdoctor-entry/entry/cli.mjs --repo "$fixture" --output "$out"
          test -s "$out/report.json"
          test -s "$out/report.md"
          python3 - "$out/report.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['verdict'] == 'SCAN_COMPLETE'
          assert data['privacy']['raw_source_output'] is False
          assert data['privacy']['filenames_output'] is False
          assert any(x['rule']=='MODEL_CALL' and x['signal_count'] >= 1 for x in data['findings'])
          PY
