name: CostDoctor 사용 후기 / User feedback
description: 공개 진단 또는 Self-Scan 사용 경험을 알려주세요. 소스코드·비밀정보·개인정보는 입력하지 마세요.
title: "[CostDoctor Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        감사합니다. 이 Issue는 공개됩니다.

        저장소 URL, 소스코드, 파일명, API key, Secret, 개인정보는 입력하지 마세요. 실제 비용·절감 수치는 검증 가능한 Evidence가 없으면 적지 않아도 됩니다.

  - type: dropdown
    id: path
    attributes:
      label: 사용 경로 / Usage path
      options:
        - 공개 저장소 URL 진단 / Public URL scan
        - 비공개 저장소 Self-Scan / Private repository Self-Scan
        - Marketplace Action
        - 문서만 확인 / Documentation only
    validations:
      required: true

  - type: textarea
    id: useful
    attributes:
      label: 도움이 된 점 / What helped
      description: 공개 가능한 일반적인 경험만 적어주세요.
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: 불편했던 점 / What was difficult
      description: 재현에 민감정보가 필요하면 내용을 적지 말고 SUPPORT.md를 확인하세요.

  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 범위 확인
      options:
        - label: 이 내용이 공개 Issue로 저장되며 소스코드·비밀정보·개인정보를 포함하지 않음을 확인합니다.
          required: true
