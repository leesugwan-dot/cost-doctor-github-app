name: CostDoctor 무료 공개 저장소 진단
description: 공개 GitHub 저장소 주소 하나를 넣으면 CostDoctor가 자동으로 정적 진단하고 이 이슈에 결과를 남깁니다.
title: "[CostDoctor Scan] "
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소 전용 무료 진단입니다.

        - 사용자 PC나 CostDoctor 운영자의 개인 PC로 프로젝트를 보내지 않습니다.
        - GitHub-hosted runner의 임시 작업공간에서 정적 분석합니다.
        - 대상 프로젝트의 코드를 실행하지 않습니다.
        - API Key, PAT, OAuth, AI 모델 결제가 필요하지 않습니다.
        - 결과는 이 공개 이슈에 표시됩니다.
        - 이 진단만으로 실제 비용·토큰 절감이 증명되는 것은 아닙니다.

  - type: input
    id: repository_url
    attributes:
      label: GitHub 저장소 주소
      description: 검사할 공개 GitHub 저장소의 주소를 그대로 붙여넣으세요.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 확인
      options:
        - label: 이 저장소가 공개 저장소이며 공개 정적 진단을 진행해도 됩니다.
          required: true
        - label: 진단 결과가 이 공개 GitHub 이슈에 표시되는 것을 확인했습니다.
          required: true
