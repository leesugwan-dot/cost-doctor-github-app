name: CostDoctor Free Public Repository Scan
description: Enter one public GitHub repository URL and receive a safe Stage 1 + Stage 2 result in this Issue.
title: "[CostDoctor Scan] "
body:
  - type: markdown
    attributes:
      value: |
        ## Enter one public GitHub URL

        This is a free scan for public GitHub repositories.

        - Target source is not sent to the operator's personal PC.
        - A bounded static analysis runs only in a temporary GitHub-hosted runner workspace.
        - Target-project code is not executed.
        - No API key, PAT, OAuth, or paid model call is required.
        - Raw source, filenames, and secrets are not included in the result comment.
        - The request and result appear in a public GitHub Issue.
        - Static signals do not prove actual calls, waste, cost, or savings.
        - The free public beta allows up to 5 scans per user in 24 hours.

        한국어: 공개 GitHub 저장소 주소 하나를 넣고 제출하면 같은 이슈에 결과가 남습니다. 대상 코드는 실행하지 않습니다.

  - type: input
    id: repository_url
    attributes:
      label: Public GitHub repository URL
      description: Paste a public repository URL. Tree, branch, blob, and file links are normalized to the repository.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: dropdown
    id: result_language
    attributes:
      label: Result language / 결과 언어
      description: English is the default. Choose 한국어 for the Korean result.
      options:
        - English
        - 한국어
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirm that this is a public repository and that the scan result will be posted to a public GitHub Issue.
          required: true
